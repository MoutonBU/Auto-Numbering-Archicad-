name: Build AutoNumber Text library part (GDL)

on:
  push:
    paths:
      - '.github/workflows/build-gdl.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Write the library part source (HSF)
        run: |
          D=gdl_src/AutoNumberText
          mkdir -p "$D/scripts"

          cat > "$D/ancestry.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Ancestry>
          	<MainGUID>F938E33A-329D-4A36-BE3E-85E126820996</MainGUID>
          	<MainGUID>103E8D2C-8230-42E1-9597-46F84CCE28C0</MainGUID>
          </Ancestry>
          EOF

          cat > "$D/calledmacros.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <CalledMacros>
          </CalledMacros>
          EOF

          cat > "$D/libpartdata.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <LibpartData Owner="1196638531" Signature="1196644685" Version="46">
          	<Identification>
          		<MainGUID>E7B5D476-6A03-46A1-B1A3-5A779219608C</MainGUID>
          		<IsPlaceable>true</IsPlaceable>
          		<IsArchivable>false</IsArchivable>
          		<MigrationValue>Normal</MigrationValue>
          		<IsTemplate>false</IsTemplate>
          	</Identification>
          	<Ancestry SectVersion="1" SectionFlags="0" SubIdent="0"/>
          	<CalledMacros SectVersion="2" SectionFlags="0" SubIdent="0"/>
          	<Script_3D SectVersion="20" SectionFlags="0" SubIdent="0"/>
          	<Script_2D SectVersion="20" SectionFlags="0" SubIdent="0"/>
          	<Script_UI SectVersion="20" SectionFlags="0" SubIdent="0"/>
          	<Script_VL SectVersion="20" SectionFlags="0" SubIdent="0"/>
          	<ParamSection SectVersion="27" SectionFlags="0" SubIdent="0"/>
          	<Copyright SectVersion="1" SectionFlags="0" SubIdent="0"/>
          	<Keywords SectVersion="1" SectionFlags="0" SubIdent="0"/>
          </LibpartData>
          EOF

          cat > "$D/libpartdocs.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <libpartdocs>
          	<Copyright>
          		<Author></Author>
          		<License>
          			<Type>CC BY</Type>
          			<Version>4.0</Version>
          		</License>
          	</Copyright>
          	<Keywords SectVersion="1" SectionFlags="0" SubIdent="0">
          		<![CDATA[autonumber, number, text, element id]]>
          	</Keywords>
          </libpartdocs>
          EOF

          cat > "$D/paramlist.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <ParamSection>
          	<ParamSectHeader>
          		<AutoHotspots>false</AutoHotspots>
          		<StatBits>
          			<STBit_FixSize/>
          		</StatBits>
          		<WDLeftFrame>0</WDLeftFrame>
          		<WDRightFrame>0</WDRightFrame>
          		<WDTopFrame>0</WDTopFrame>
          		<WDBotFrame>0</WDBotFrame>
          		<LayFlags>65535</LayFlags>
          		<WDMirrorThickness>0</WDMirrorThickness>
          		<WDWallInset>0</WDWallInset>
          	</ParamSectHeader>
          	<Parameters SectVersion="27" SectionFlags="0" SubIdent="0">
          		<Length Name="A">
          			<Description><![CDATA["Dimension 1"]]></Description>
          			<Fix/>
          			<Value>1</Value>
          		</Length>
          		<Length Name="B">
          			<Description><![CDATA["Dimension 2"]]></Description>
          			<Fix/>
          			<Value>1</Value>
          		</Length>
          		<Length Name="ZZYZX">
          			<Description><![CDATA["Height"]]></Description>
          			<Fix/>
          			<Value>1</Value>
          		</Length>
          		<Boolean Name="AC_show2DHotspotsIn3D">
          			<Description><![CDATA["Show 2D Hotspots in 3D"]]></Description>
          			<Fix/>
          			<Flags>
          				<ParFlg_Hidden/>
          			</Flags>
          			<Value>1</Value>
          		</Boolean>
          		<Length Name="ac_bottomlevel">
          			<Description><![CDATA["Bottom Level"]]></Description>
          			<Fix/>
          			<Flags>
          				<ParFlg_Hidden/>
          			</Flags>
          			<Value>1</Value>
          		</Length>
          		<Length Name="ac_toplevel">
          			<Description><![CDATA["Top Level"]]></Description>
          			<Fix/>
          			<Flags>
          				<ParFlg_Hidden/>
          			</Flags>
          			<Value>0</Value>
          		</Length>
          		<RealNum Name="txtSize">
          			<Description><![CDATA["7. Text: size (mm on paper)"]]></Description>
          			<Value>3.5</Value>
          		</RealNum>
          		<String Name="txtFont">
          			<Description><![CDATA["5. Text: font"]]></Description>
          			<Value><![CDATA["Arial"]]></Value>
          		</String>
          		<Integer Name="txtStyle">
          			<Description><![CDATA["6. Text: style"]]></Description>
          			<Value>0</Value>
          		</Integer>
          		<PenColor Name="txtPen">
          			<Description><![CDATA["8. Text: pen"]]></Description>
          			<Value>1</Value>
          		</PenColor>
          		<Integer Name="numSource">
          			<Description><![CDATA["1. Number: source"]]></Description>
          			<Value>0</Value>
          		</Integer>
          		<Integer Name="manualNum">
          			<Description><![CDATA["2. Number: manual value (0 - 100000000)"]]></Description>
          			<Value>1</Value>
          		</Integer>
          		<Integer Name="numFormat">
          			<Description><![CDATA["3. Number: format (digits / letters)"]]></Description>
          			<Value>0</Value>
          		</Integer>
          		<Integer Name="numPad">
          			<Description><![CDATA["4. Number: zero padding"]]></Description>
          			<Value>0</Value>
          		</Integer>
          		<String Name="prefix">
          			<Description><![CDATA["9. Text: before number"]]></Description>
          			<Value><![CDATA[""]]></Value>
          		</String>
          		<String Name="suffix">
          			<Description><![CDATA["10. Text: after number"]]></Description>
          			<Value><![CDATA[""]]></Value>
          		</String>
          		<Integer Name="frameType">
          			<Description><![CDATA["11. Frame: type"]]></Description>
          			<Value>0</Value>
          		</Integer>
          		<RealNum Name="frameSize">
          			<Description><![CDATA["12. Frame: size (mm on paper)"]]></Description>
          			<Value>4</Value>
          		</RealNum>
          		<PenColor Name="framePen">
          			<Description><![CDATA["13. Frame: pen"]]></Description>
          			<Value>1</Value>
          		</PenColor>
          	</Parameters>
          </ParamSection>
          EOF

          cat > "$D/scripts/2d.gdl" <<'EOF'
          ! AutoNumber Text - shows a number/letter taken from the object's Element ID
          ! --- diagnostic marks: a square and text must appear ---
          _u = GLOB_SCALE / 1000
          pen 1
          rect2 -2 * _u, -2 * _u, 2 * _u, 2 * _u
          text2 0, -4 * _u, "TEST"

          _id = GLOB_ID
          _digits = ""
          _len = strlen(_id)
          _i = 1
          while _i <= _len do
          	_ch = strsub(_id, _i, 1)
          	if _ch = "0" | _ch = "1" | _ch = "2" | _ch = "3" | _ch = "4" | _ch = "5" | _ch = "6" | _ch = "7" | _ch = "8" | _ch = "9" then _digits = _digits + _ch
          	_i = _i + 1
          endwhile

          _num = 0
          if strlen(_digits) > 0 then _num = val(_digits)
          if numSource = 1 then _num = manualNum
          if _num < 0 then _num = 0

          _body = ""
          if numFormat = 0 then
          	_body = str(_num, 1, 0)
          	while strlen(_body) < numPad do
          		_body = "0" + _body
          	endwhile
          else
          	_abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
          	if numFormat = 2 then _abc = "abcdefghijklmnopqrstuvwxyz"
          	if _num = 0 then
          		_body = "0"
          	else
          		_v = _num
          		while _v > 0 do
          			_r = (_v - 1) - 26 * int((_v - 1) / 26)
          			_body = strsub(_abc, _r + 1, 1) + _body
          			_v = int((_v - 1) / 26)
          		endwhile
          	endif
          endif
          if strlen(_id) = 0 & numSource = 0 then _body = "?"
          _txt = prefix + _body + suffix

          ! plain-style copy of the number (no custom style) above the square
          text2 0, 4 * _u, _txt

          _r2 = frameSize * GLOB_SCALE / 1000
          if frameType = 1 then
          	pen framePen
          	circle2 0, 0, _r2
          endif
          if frameType = 2 then
          	pen framePen
          	rect2 -_r2, -_r2, _r2, _r2
          endif

          define style "anum_style" txtFont, txtSize, 5, txtStyle
          style "anum_style"
          pen txtPen
          text2 0, 0, _txt

          hotspot2 0, 0
          EOF

          cat > "$D/scripts/vl.gdl" <<'EOF'
          values "txtFont" "Arial", "Arial Black", "Arial Narrow", "Bahnschrift", "Calibri", "Cambria", "Candara", "Century Gothic", "Comic Sans MS", "Consolas", "Courier New", "Franklin Gothic Medium", "Gabriola", "Georgia", "Impact", "Lucida Console", "Palatino Linotype", "Segoe UI", "Segoe Print", "Tahoma", "Times New Roman", "Trebuchet MS", "Verdana", "Helvetica"
          values{2} "txtStyle" 0, "Regular", 1, "Bold", 2, "Italic", 3, "Bold Italic", 4, "Underline"
          values{2} "frameType" 0, "No frame", 1, "Circle", 2, "Square"
          values "txtSize" range [0.5, 50]
          values "frameSize" range [0.5, 100]
          values{2} "numSource" 0, "Element ID (auto)", 1, "Manual number"
          values "manualNum" range [0, 100000000]
          values{2} "numFormat" 0, "Numbers (0, 1, 2 ...)", 1, "Letters A, B ... Z, AA, AB", 2, "Letters a, b ... z, aa, ab"
          values "numPad" range [0, 12]
          EOF

          cat > "$D/scripts/ui.gdl" <<'EOF'
          ui_dialog "AutoNumber Text", 360, 500

          ui_outfield "Number comes from the Element ID, or type your own.", 12, 8, 336, 30
          ui_separator 12, 44, 348, 44

          ui_outfield "Number source", 12, 62, 116, 20
          ui_infield "numSource", 132, 58, 216, 24
          ui_outfield "Manual number", 12, 94, 116, 20
          ui_infield "manualNum", 132, 90, 216, 24
          ui_outfield "Number format", 12, 126, 116, 20
          ui_infield "numFormat", 132, 122, 216, 24
          ui_outfield "Zero padding", 12, 158, 116, 20
          ui_infield "numPad", 132, 154, 216, 24
          ui_separator 12, 188, 348, 188

          ui_outfield "Font (dropdown)", 12, 206, 116, 20
          ui_infield "txtFont", 132, 202, 216, 24
          ui_outfield "Style", 12, 238, 116, 20
          ui_infield "txtStyle", 132, 234, 216, 24
          ui_outfield "Size (mm on paper)", 12, 270, 116, 20
          ui_infield "txtSize", 132, 266, 216, 24
          ui_outfield "Text pen", 12, 302, 116, 20
          ui_infield "txtPen", 132, 298, 216, 24
          ui_separator 12, 332, 348, 332

          ui_outfield "Text before number", 12, 350, 116, 20
          ui_infield "prefix", 132, 346, 216, 24
          ui_outfield "Text after number", 12, 382, 116, 20
          ui_infield "suffix", 132, 378, 216, 24
          ui_separator 12, 412, 348, 412

          ui_outfield "Frame", 12, 430, 110, 20
          ui_infield "frameType", 132, 426, 216, 24
          ui_outfield "Frame size / pen", 12, 462, 116, 20
          ui_infield "frameSize", 132, 458, 104, 24
          ui_infield "framePen", 244, 458, 104, 24
          EOF

          cat > "$D/scripts/3d.gdl" <<'EOF'
          ! 2D annotation object: no 3D geometry
          EOF

          find gdl_src -type f

      - name: Download LP_XMLConverter
        run: |
          curl -L --fail -o lp.zip "https://github.com/GRAPHISOFT/archicad-api-devkit/releases/download/29.3000/LP_XMLConverter.WIN.29.3000.zip"
          7z x lp.zip -oLP -y > /dev/null
          LP=$(find LP -iname LP_XMLConverter.exe | head -1)
          echo "Found converter: $LP"
          test -n "$LP"
          echo "LP=$LP" >> "$GITHUB_ENV"

      - name: Compile the library part (.gsm)
        run: |
          mkdir -p gdl_out
          "$LP" hsf2l "$(cygpath -w "$PWD/gdl_src")" "$(cygpath -w "$PWD/gdl_out")"
          ls -la gdl_out

      - name: Package the source with a local builder (uses YOUR Archicad's own converter)
        run: |
          mkdir -p pack
          cp -r gdl_src pack/src
          cat > pack/BUILD_GSM.bat <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"
          echo === AutoNumber Text installer ===
          set "LPX="
          set "ACDIR="
          for %%V in (28 29 27 26) do call :probe %%V
          if not defined LPX goto :nolpx
          echo Using: %LPX%
          if not exist "%~dp0src\AutoNumberText\paramlist.xml" goto :nosrc
          if exist "%~dp0out" rmdir /s /q "%~dp0out"
          mkdir "%~dp0out"
          set "OK="
          for %%N in (46 45 44 43 42 41 40 39 38 37 36) do if not defined OK call :try %%N
          if not defined OK goto :convfail
          echo.
          echo Built OK with library format %OK%.

          set "LIB="
          for /d %%D in ("%ACDIR%\Archicad Library*") do if not defined LIB set "LIB=%%~fD"
          if not defined LIB goto :fallback
          mkdir "%LIB%\AutoNumberText" 2>nul
          copy /y "%~dp0out\*.gsm" "%LIB%\AutoNumberText\" >nul
          if errorlevel 1 goto :fallback
          echo.
          echo INSTALLED to: %LIB%\AutoNumberText
          echo Now in Archicad: File - Libraries and Objects - Library Manager - Reload Libraries.
          goto :end

          :fallback
          set "LIB=%USERPROFILE%\Documents\GRAPHISOFT\AutoNumberText Library"
          mkdir "%LIB%" 2>nul
          copy /y "%~dp0out\*.gsm" "%LIB%\" >nul
          echo.
          echo Could not write into Archicad's own folder. Right-click this file and choose Run as administrator to install there.
          echo For now it was saved to: %LIB%
          echo In Archicad: File - Libraries and Objects - Library Manager - Add Library - pick that folder.
          goto :end

          :nolpx
          echo Could not find LP_XMLConverter.exe in C:\Program Files\GRAPHISOFT\Archicad 28.
          goto :end

          :nosrc
          echo The src folder is missing. Extract the WHOLE zip first, then run this file from the extracted folder.
          goto :end

          :convfail
          echo The converter could not build it with any library format (see messages above). Please send me a screenshot of this window.
          goto :end

          :try
          echo.
          echo Trying library format %1 ...
          if exist "%~dp0work" rmdir /s /q "%~dp0work"
          xcopy /e /i /y /q "%~dp0src" "%~dp0work" >nul
          powershell -NoProfile -Command "$p='%~dp0work\AutoNumberText\libpartdata.xml'; $t=Get-Content -Raw $p; $t=$t -replace 'Version=.46.',('Version={0}{1}{0}' -f [char]34,'%1'); Set-Content -NoNewline -Path $p -Value $t"
          del /q "%~dp0out\*.gsm" 2>nul
          "%LPX%" hsf2l "%~dp0work" "%~dp0out"
          if exist "%~dp0out\*.gsm" set "OK=%1"
          goto :eof


          :probe
          if defined LPX goto :eof
          if exist "%ProgramFiles%\GRAPHISOFT\Archicad %1\LP_XMLConverter.exe" set "LPX=%ProgramFiles%\GRAPHISOFT\Archicad %1\LP_XMLConverter.exe"
          if defined LPX set "ACDIR=%ProgramFiles%\GRAPHISOFT\Archicad %1"
          goto :eof

          :end
          echo.
          pause
          EOF
          sed -i 's/$/\r/' pack/BUILD_GSM.bat
          find pack -type f

      - name: Upload source and builder
        uses: actions/upload-artifact@v4
        with:
          name: AutoNumberText-source-and-builder
          path: pack
          if-no-files-found: error

      - name: Upload the library part
        uses: actions/upload-artifact@v4
        with:
          name: AutoNumberText-library-part
          path: gdl_out/*.gsm
          if-no-files-found: error
