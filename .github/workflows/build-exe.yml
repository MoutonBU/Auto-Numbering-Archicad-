name: Build Python AutoNumber exe

on:
  push:
    paths:
      - 'python/**'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: python -m pip install --upgrade pip archicad pyinstaller

      - name: Build the exe
        run: pyinstaller --onefile --noconsole --name AutoNumber-Python python/archicad_autonumber_gui.py

      - name: Upload the exe
        uses: actions/upload-artifact@v4
        with:
          name: AutoNumber-Python-exe
          path: dist/AutoNumber-Python.exe
          if-no-files-found: error
