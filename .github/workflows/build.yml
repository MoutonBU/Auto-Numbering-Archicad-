name: Build AutoNumber

on:
  push:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ matrix.os-type }}

    strategy:
      fail-fast: false
      matrix:
        os-type: [ windows-2022, macos-14 ]
        ac-version: [ 27, 28, 29, 30 ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Xcode
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode_15.1.app

      - name: Build and package
        run: python Tools/BuildAddOn.py --configFile config.json --acVersion ${{ matrix.ac-version }} --buildConfig Release --package

      - name: Upload the plugin (zip)
        uses: actions/upload-artifact@v4
        with:
          name: AutoNumber-Archicad${{ matrix.ac-version }}-${{ runner.os }}
          path: Build/Package/**/*.zip
          if-no-files-found: error

      - name: Build the Windows installer (.exe)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y --no-progress
          APX=$(find Build/Package -name AutoNumber.apx | head -1)
          echo "Using $APX"
          export MSYS_NO_PATHCONV=1
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAcVer=${{ matrix.ac-version }}" "/DApx=$(cygpath -w "$PWD/$APX")" Installer/AutoNumber.iss

      - name: Upload the installer (.exe)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: AutoNumber-Setup-Archicad${{ matrix.ac-version }}
          path: Installer/Output/*.exe
          if-no-files-found: error
